[project]
name = "feinalive-launcher"
version = "0.1.0"
description = "PySide6 operations launcher for feinaLive"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyside6>=6.8.0,<7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launcher"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
