# ============================================================
# FeinaLive 配置文件示例
# 复制此文件为 config.yaml 并填入实际值
# ============================================================

# 数据库配置
storage:
  sqlite_path: "data/feinalive.db"
  chroma_path: "data/chroma"
  chroma_collection: "memory_atoms"

# 同一进程只启动一个直播平台；平台、房间或凭据修改后重启生效
live:
  platform: "bilibili"  # bilibili / douyin / test

# B站直播配置
bilibili:
  sessdata: ""  # 请通过控制台保存到系统密钥库，或设置 BILIBILI_SESSDATA
  room_id: 0    # 直播间 ID
  uid: 0

# 抖音直播配置（web_rid 是 live.douyin.com/ 后的部分）
douyin:
  web_rid: ""
  cookie: ""  # 请通过控制台保存到系统密钥库，或设置 DOUYIN_COOKIE

admin:
  username: ""
  identities:
    bilibili: ""
    douyin: ""

# 直播间公告（显示在直播间标题下方）
announcement: "AI主播是小笨蛋不要欺负她喵。输入 点歌 歌名 进行点歌。输入/clear 清除AI对你的记忆。"

# 独立音乐系统
music:
  default_provider: "auto"
  min_duration_seconds: 60
  max_duration_seconds: 480
  queue_capacity: 5
  per_user_limit: 2
  allow_bare_bv: false
  accept_score: 60
  reject_score: -50
  llm_min_confidence: 0.75
  search_candidates: 5
  ducking_factor: 0.2
  ducking_enabled: true
  local_directories:
    - "D:/Music"

# ============================================================
# LLM 配置
# ============================================================

# 通用 LLM 配置
# 用途：RAG 检索、用户记忆总结、游戏记忆总结等通用任务
llm:
  api_url: "http://127.0.0.1:8081/v1"  # Bifrost Gateway 的 OpenAI-compatible 地址
  api_key: ""  # Gateway 启用鉴权时通过控制台保存，或设置 LLM_API_KEY
  model: "deepseek/deepseek-chat"       # Bifrost 中注册的模型名
  temperature: 0.1
  top_p: 0.9
  max_tokens: 200
  disable_thinking: true         # 禁用模型的思考过程输出

# 用户对话批量总结配置
ai:
  summary_interval: 10              # 累计多少轮已回复对话后立即总结
  summary_idle_seconds: 300          # 未达到数量时，用户空闲多久后补总结
  summary_scan_interval_seconds: 60  # 定时总结扫描间隔
  max_recent_messages: 16            # 仅控制回复上下文，不限制待总结队列

# Embedding 配置（同样经 Bifrost Gateway）
embedding:
  api_url: ""       # 留空则复用 llm.api_url
  api_key: ""       # 留空则复用 llm.api_key
  model: ""         # 例如 text-embedding-3-small / doubao-embedding 等
  dimensions: null
  user_graph_enabled: true  # 用户图入口是否使用向量召回；关闭后使用 FTS5/LIKE
  game_graph_enabled: true  # 游戏图入口是否使用向量召回；关闭后使用 FTS5/LIKE

# 主播大脑 LLM 配置
# 用途：AI 主播对话、弹幕回复、风格化解说
host:
  reply_interval: 5       # 弹幕回复间隔（秒）
  max_reply_length: 100   # 单条回复最大长度
  playback_timeout_seconds: 90  # 等待唯一播放端确认实际播放完成
  model: "deepseek-v4-flash"
  temperature: 0.7
  top_p: 0.9
  max_tokens: 200

# ============================================================
# TTS 语音合成配置
# ============================================================

tts:
  gateway_url: "http://127.0.0.1:8091/v1"
  api_key: ""                    # Gateway 开启鉴权时保存到系统密钥库
  model: "host_voice"            # Gateway 路由别名，或直接使用 provider/model
  response_format: "mp3"
  speed: 1.0
  timeout_seconds: 60

# ============================================================
# Agent 与静态场景配置
# ============================================================

agent:
  enabled: false          # 是否启用 AgentRuntime
  scenario_id: "slay_the_spire"
  mcp_url: "http://127.0.0.1:8080"  # MCP 服务地址
  api_url: "http://127.0.0.1:8081/v1"
  api_key: ""  # 请通过控制台保存到系统密钥库，或设置 AGENT_API_KEY
  model: "deepseek-v4-flash"
  temperature: 0.4
  max_tokens: 8000
  poll_interval: 1.0      # 轮询游戏状态的间隔（秒）
  memory_threshold: 30    # 记忆条数阈值，超过后自动总结
  min_step_interval: 3.0  # 游戏操作最小间隔（秒），模拟真人操作速度
  step_jitter: 0.5        # 操作间隔随机误差范围（±秒），使操作更自然
  commentary_interval: 30.0 # 解说建议间隔（秒），只是建议，无值得说的事时不强行解说
  memory_eagerness: 3     # 记忆积极度 1-5，越大越爱记录
  scenario_config:
    default_character: "IRONCLAD"  # 杀戮尖塔场景配置
  min_commentary_interval: 15.0  # 解说请求最小间隔（秒）
  queue_max_size: 20      # 消息队列最大容量
  host_history_maxlen: 50 # 主播回答历史最大条数
  action_history_maxlen: 30 # Agent 动作历史最大条数

# ============================================================
# FeinaAvatar 数字人配置
# ============================================================

avatar:
  enabled: true
  character: "feina00"
  motion:
    source: "autonomous"  # autonomous | browser
    allow_browser_control: true
  lip_sync:
    source: "browser_audio"
    sensitivity: 3.0
    noise_gate: 0.015
    attack_ms: 35
    release_ms: 90
  renderer:
    engine: "feina_avatar"
    model: "tha3"         # tha3 | tha4 | tha4_student
    backend: "onnxruntime" # onnxruntime | tensorrt
    precision: "fp32"     # fp32 | fp16
    separable: false
    use_eyebrow: true     # 是否启用眉毛追踪
    frame_rate: 30
    interpolation: 1
    super_resolution: 1
    ram_cache_mb: 2048
    vram_cache_mb: 2048
  outputs:
    spout:
      enabled: true
      name: "FeinaAvatar"
    preview:
      enabled: true
      frame_rate: 10
      quality: 80
