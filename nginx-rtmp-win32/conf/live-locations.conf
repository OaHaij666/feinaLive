# Minimal runtime surface required by the audience-facing live canvas.
location = /config {
    limit_except GET { deny all; }
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /live/ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}

location = /music/state {
    limit_except GET { deny all; }
    proxy_pass http://backend;
    proxy_set_header Host $host;
}

location ~ ^/music/stream/[^/]+$ {
    limit_except GET { deny all; }
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_read_timeout 3600s;
}

location ~ ^/music/player/(claim|heartbeat|release)$ {
    limit_except POST { deny all; }
    proxy_pass http://backend;
    proxy_set_header Host $host;
}

location = /music/playback/events {
    limit_except POST { deny all; }
    proxy_pass http://backend;
    proxy_set_header Host $host;
}

location = /avatar/control {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}
