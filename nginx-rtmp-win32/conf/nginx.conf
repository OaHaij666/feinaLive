worker_processes 1;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

# RTMP is optional. The frontend and HLS servers remain usable without it.
# rtmp {
#     server {
#         listen 1935;
#         chunk_size 4096;
#         application live {
#             live on;
#             hls on;
#             hls_path hls;
#             hls_fragment 2s;
#             hls_playlist_length 10s;
#             hls_cleanup on;
#         }
#     }
# }

http {
    include mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    upstream backend {
        server 127.0.0.1:9191;
    }

    # Audience-facing live canvas.
    server {
        listen 127.0.0.1:8088;
        include live-locations.conf;

        location /hls {
            root .;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header X-Accel-Buffering no;
        }

        location / {
            root ../fronted/dist/live;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # Operator-only control console. It intentionally has a separate origin
    # so OBS/browser-source rendering never competes with management UI.
    server {
        listen 127.0.0.1:8089;
        include backend-locations.conf;

        location / {
            root ../fronted/dist/console;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
