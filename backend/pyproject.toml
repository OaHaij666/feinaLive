[project]
name = "feina-backend"
version = "0.1.0"
description = "feinaLive后端服务"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "httpx>=0.28.0",
    "openai>=2.0.0,<3.0.0",
    "brotli>=1.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "blivedm",
    "bilibili-api-python>=6.0.0",
    "aiohttp>=3.14.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "chromadb>=1.0.0,<2.0.0",
    "keyring>=25.0.0",
    "cryptography>=48.0.1",
    "langgraph>=0.2.0",
    "numpy",
    "scipy",
    "protobuf>=6.33.5,<7",
    "betterproto==2.0.0b6",
    "mini-racer>=0.12.4",
    "opencv-python>=4.13.0,<5",
    "Pillow>=12.3.0",
    "mutagen>=1.47.0",
    "pyopengl",
    "onnx>=1.22.0,<1.23.0",
    "onnxruntime-gpu>=1.21.0,<1.23.0",
    "tqdm",
    "torch>=2.6.0,<2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]
tts-edge = [
    "edge-tts>=6.1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
blivedm = { git = "https://github.com/xfgryujk/blivedm.git", branch = "master" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["apps", "avatar_engine", "vendor"]

[tool.uv]
override-dependencies = [
    # Chroma's bundled default embedding function needs the CPU wheel; feinaLive
    # always supplies embeddings itself, while FeinaAvatar needs the GPU wheel.
    "onnxruntime; sys_platform == 'never'",
    # blivedm's metadata still caps Brotli below the patched 1.2 release; the
    # public API it uses remains compatible, so enforce the security update.
    "brotli>=1.2.0",
    "aiohttp>=3.14.1",
    "yarl>=1.17.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_llm: calls the configured external LLM and is opt-in",
]
